version: 2
updates:
  # Root workspace Cargo.toml. Dependabot follows the [workspace] manifest and
  # transitively watches every member, so a single root entry covers all
  # 11 crates (auth, awslc, certified, cloud, cluster, cng, infineon, kmip,
  # nxp, openssl, pkcs11).
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
    open-pull-requests-limit: 10
    reviewers:
      - "craton-co/core-team"
    commit-message:
      prefix: "chore"

  # Per-crate entries for any crate that declares its own Cargo.toml with
  # dependencies not lifted to the workspace [workspace.dependencies] table.
  # Keeping these explicit means Dependabot opens per-crate PRs when a
  # security-sensitive crate (auth, awslc, certified, kmip, pkcs11) needs a
  # focused bump, which is easier to review than a workspace-wide bump.
  - package-ecosystem: "cargo"
    directory: "/craton-hsm-auth"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "auth"
    reviewers:
      - "craton-co/core-team"
      - "craton-co/security"
    commit-message:
      prefix: "chore(auth)"

  - package-ecosystem: "cargo"
    directory: "/craton-hsm-awslc"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "fips"
    reviewers:
      - "craton-co/core-team"
      - "craton-co/security"
    commit-message:
      prefix: "chore(awslc)"

