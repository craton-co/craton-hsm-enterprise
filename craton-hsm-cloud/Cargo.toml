[package]
name = "craton-hsm-cloud"
description = "Cloud-native integrations: K8s CSI, Vault plugin, AWS/Azure shims"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
homepage.workspace = true
documentation.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "README.md"
build = "build.rs"

[features]
## Default enables all four cloud shims. Audit foot-gun (cloud shims compiled
## unconditionally): each shim now lives behind its own feature gate so an
## embedder that only needs, say, `aws` doesn't link the Azure / Vault / CSI
## glue. Defaults stay broad (`aws`, `azure`, `vault`, `csi` all on) to avoid
## breaking existing callers; opt-out by building with `default-features =
## false` and re-listing the shims you actually need.
default = ["aws", "azure", "vault", "csi"]
## Enable the AWS CloudHSM shim (`aws_shim` module).
aws = []
## Enable the Azure Key Vault shim (`azure_shim` module).
azure = []
## Enable the HashiCorp Vault transit shim (`vault_plugin` module).
vault = []
## Enable the Kubernetes CSI driver shim (`k8s_csi` module).
csi = []
## Expose mock/in-memory implementations for testing and local development.
## These implementations use fake crypto and in-memory storage — never use them
## in production.  The feature is intentionally named `mock-insecure-do-not-ship`
## so it appears prominently in `cargo tree` output and audit logs. It is NOT
## enabled by default; opt in explicitly during development. At runtime, the
## mock constructors additionally require the environment variable
## `CRATON_HSM_ALLOW_MOCK=1` to be set, providing a second line of defence.
mock-insecure-do-not-ship = []
## Opt-in helper for downstream crates/tests that want the permissive default
## identity without hand-rolling an AllowAll ACL. Never enable in production;
## this is strictly a test-convenience lever (audit finding H20).
permissive-for-tests = []

[dependencies]
serde = { version = "=1.0.225", features = ["derive"] }
serde_json = "=1.0.140"
tracing = "=0.1.41"
dashmap = "=6.1.0"
subtle = "=2.6.1"
parking_lot = "=0.12.3"
sha2 = "=0.10.9"
hmac = "=0.12.1"
hkdf = "=0.12.4"
rand = { workspace = true }
zeroize = { version = "=1.8.1", features = ["derive"] }

[target.'cfg(unix)'.dependencies]
nix = { version = "=0.29.0", features = ["socket", "fs", "user"] }

[dev-dependencies]
tempfile = "=3.19.1"
